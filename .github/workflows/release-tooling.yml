name: release-tooling
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/**'
      - 'src-tauri/crates/release-verify/**'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package*.json'
      - '.github/workflows/release-tooling.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src-tauri/crates/release-verify/**'
      - 'src-tauri/tauri.conf.json'
      - 'src-tauri/Cargo.toml'
      - 'src-tauri/Cargo.lock'
      - 'package*.json'
      - '.github/workflows/release-tooling.yml'
permissions:
  contents: read
jobs:
  release-tooling:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Verify release tooling without signing credentials or publishing
        run: npm run release:test
