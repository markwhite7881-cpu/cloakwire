name: release-linux

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Linux x64 (DEB + AppImage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.0.0
        with:
          go-version: '1.25.5'

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libgtk-3-dev libssl-dev libcap2-bin file

      - name: Build pinned sing-box sidecar
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/sing-box-src
          cd /tmp/sing-box-src
          git remote add origin https://github.com/Leadaxe/sing-box-lx.git
          git fetch --depth 1 origin 9558ceb27bc1e92e2ecfa96ebfe6b3f688344c5a
          git checkout --detach FETCH_HEAD
          git submodule update --init --depth 1 submodules/gvisor submodules/sing-tun submodules/wireguard-go
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -tags 'with_xhttp with_awg with_quic with_wireguard with_utls with_clash_api with_lx_command' \
            -trimpath -ldflags '-s -w -buildid=' \
            -o "$GITHUB_WORKSPACE/src-tauri/binaries/sing-box-x86_64-unknown-linux-gnu" \
            ./cmd/sing-box
          chmod +x "$GITHUB_WORKSPACE/src-tauri/binaries/sing-box-x86_64-unknown-linux-gnu"
          "$GITHUB_WORKSPACE/src-tauri/binaries/sing-box-x86_64-unknown-linux-gnu" version

      - name: Prepare pinned Xray sidecar
        run: |
          python3 scripts/prepare-xray-sidecar.py --target x86_64-unknown-linux-gnu
          src-tauri/binaries/xray-x86_64-unknown-linux-gnu version

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm test
          npm run build
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Build DEB and AppImage
        run: npm run tauri:build -- --bundles deb,appimage
        env:
          NO_STRIP: 'true'

      - name: Inject DEB capabilities and collect artifacts
        run: |
          SKIP_TAURI_BUILD=1 ./scripts/build-linux-deb.sh 1.3.2
          sha256sum dist-release/Cloakwire_1.3.2_amd64.deb \
            dist-release/Cloakwire_1.3.2_amd64.AppImage > dist-release/SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cloakwire-linux-amd64
          path: |
            dist-release/Cloakwire_1.3.2_amd64.deb
            dist-release/Cloakwire_1.3.2_amd64.AppImage
            dist-release/SHA256SUMS-linux.txt
          if-no-files-found: error
          retention-days: 14
