name: release-android

# Build the Cloakwire Android APK on every push to the linux/macos-build
# branch (shared dev branch for non-Windows ports) and on tag pushes.
#
# Stages pinned sing-box-lx and Xray binaries for the Android ARM64 build.
# Installs the same NDK as the local release build.

# Release signing: add these repo secrets and the sign step activates
# automatically:
#   ANDROID_KEYSTORE_BASE64  — base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Without them the release APK stays unsigned (debug APK still works
# for sideloading / testing).

on:
  push:
    branches:
      - linux/macos-build
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: build APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "28.0.13004108"
      # secrets context can't be used in `if:` directly — bounce it
      # through env first. Expression evaluates to "true"/"false".
      HAVE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        # ubuntu-latest runners ship the Android SDK at $ANDROID_HOME
        # but not our exact NDK. AGP 8.11 supports NDK 28; gomobile
        # needs ANDROID_NDK_HOME to find the clang toolchains.
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          ls "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/bin" | head -5

      - name: Setup Rust (android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-android-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            cargo-android-

      - name: Prepare pinned Android cores
        run: |
          set -euo pipefail
          libbox=src-tauri/gen/android/app/libs/libbox.aar
          mkdir -p "$(dirname "$libbox")"
          curl --fail --silent --show-error --location 'https://github.com/Leadaxe/sing-box-lx/releases/download/v1.14.4-lx.35/libbox-1.14.4-lx.35.aar' -o "$libbox"
          printf '%s  %s\n' 'e5cfd79364316150acd5c9ddbb5d6d8c749f1ce4a590f9a3eaa408f949b8fd7b' "$libbox" | sha256sum -c -
          python3 scripts/prepare-xray-sidecar.py --target aarch64-linux-android

      - name: Install JS deps
        run: npm ci

      - name: Build debug APK
        # Debug build is signed with the auto-generated Android debug
        # key by AGP — installable on devices as-is.
        run: npx tauri android build --target aarch64 --apk --verbose

      - name: Build release APK
        run: npx tauri android build --target aarch64 --apk --release --verbose

      - name: Sign release APK (when keystore secrets exist)
        if: env.HAVE_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          APK=$(ls -1 src-tauri/gen/android/app/build/outputs/apk/universal/release/*-unsigned.apk | head -1)
          "$ANDROID_HOME/build-tools/"*/apksigner sign \
            --ks /tmp/release.keystore \
            --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
            --key-pass "pass:$ANDROID_KEY_PASSWORD" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --out src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
            "$APK"
          "$ANDROID_HOME/build-tools/"*/apksigner verify --print-certs \
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk

      - name: Collect artifacts
        run: |
          set -e
          mkdir -p dist
          VER=$(node -p "require('./package.json').version")
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk \
             "dist/Cloakwire_${VER}_android_universal_debug.apk"
          if [ -f src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk ]; then
            cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
               "dist/Cloakwire_${VER}_android_universal_release.apk"
          else
            cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
               "dist/Cloakwire_${VER}_android_universal_release-unsigned.apk"
          fi
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloakwire-android
          path: dist/
          if-no-files-found: error
          retention-days: 14
