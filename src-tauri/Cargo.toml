[package]
name = "cloakwire"
version = "1.3.2"
description = "Cloakwire - privacy-first dual-engine GUI VPN client"
authors = ["Alexey"]
license = "MIT"
repository = "https://github.com/markwhite7881-cpu/cloakwire"
edition = "2021"
rust-version = "1.77"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[[bin]]
name = "cloakwire"
path = "src/main.rs"

[lib]
name = "cloakwire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
tonic-build = "0.12"
protoc-bin-vendored = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
minisign = "0.9"
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost", "transport"] }
prost = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "process", "io-util", "time", "fs", "net"] }
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
percent-encoding = "2"
url = "2"
base64 = "0.22"

[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-autostart = "2"
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }

[target."cfg(windows)".dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[workspace]
exclude = ["crates/tauri-signer"]
